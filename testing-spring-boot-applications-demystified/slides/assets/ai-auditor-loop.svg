<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="600" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="lBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f4ff"/><stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="lAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="lGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf8ee"/><stop offset="1" stop-color="#c8e6c9"/>
    </linearGradient>
    <radialGradient id="lBadge" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#66bb6a"/><stop offset="1" stop-color="#2e7d32"/>
    </radialGradient>
    <linearGradient id="lRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0f1"/><stop offset="1" stop-color="#ffcdd2"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2b3a" flood-opacity="0.18"/>
    </filter>
    <marker id="loopArr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#388e3c"/></marker>
  </defs>

  <rect width="640" height="600" fill="#0000"/>

  <text x="320" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#22303c">The Auditor's Feedback Loop</text>

  <!-- Cyclic arrows behind the nodes -->
  <g fill="none" stroke="#388e3c" stroke-width="2.5">
    <path d="M402,118 C470,135 492,180 488,222" marker-end="url(#loopArr)"/>
    <path d="M488,290 C492,332 470,372 404,388" marker-end="url(#loopArr)"/>
    <path d="M236,388 C170,372 148,332 152,290" marker-end="url(#loopArr)"/>
    <path d="M152,222 C148,180 170,135 238,118" marker-end="url(#loopArr)"/>
  </g>

  <!-- Center badge -->
  <g filter="url(#soft2)"><circle cx="320" cy="252" r="74" fill="url(#lBadge)" stroke="#1b5e20" stroke-width="2"/></g>
  <text x="320" y="240" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">Confidence</text>
  <text x="320" y="262" font-size="14" text-anchor="middle" fill="#e8f5e9">in every</text>
  <text x="320" y="280" font-size="14" text-anchor="middle" fill="#e8f5e9">commit</text>

  <!-- Top: AI generates -->
  <g filter="url(#soft2)"><rect x="228" y="54" width="184" height="66" rx="14" fill="url(#lBlue)" stroke="#2196f3" stroke-width="2"/></g>
  <text x="320" y="84" font-size="14" text-anchor="middle" font-weight="bold" fill="#0d47a1">AI / human generate</text>
  <text x="320" y="103" font-size="13" text-anchor="middle" fill="#1565c0">code + tests</text>

  <!-- Right: You audit -->
  <g filter="url(#soft2)"><rect x="452" y="220" width="172" height="66" rx="14" fill="url(#lAmber)" stroke="#fb8c00" stroke-width="3"/></g>
  <text x="538" y="250" font-size="16" text-anchor="middle" font-weight="bold" fill="#e65100">You audit</text>
  <text x="538" y="269" font-size="11" text-anchor="middle" font-style="italic" fill="#ef6c00">review &#183; judge &#183; verify</text>

  <!-- Bottom: Fast test suite -->
  <g filter="url(#soft2)"><rect x="228" y="386" width="184" height="66" rx="14" fill="url(#lGreen)" stroke="#4caf50" stroke-width="2"/></g>
  <text x="320" y="414" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b5e20">&#9889; Fast test suite</text>
  <text x="320" y="434" font-size="11" text-anchor="middle" fill="#2e7d32">seconds, not minutes</text>

  <!-- Left: Fast feedback -->
  <g filter="url(#soft2)"><rect x="16" y="220" width="172" height="66" rx="14" fill="url(#lGreen)" stroke="#43a047" stroke-width="2"/></g>
  <text x="102" y="250" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b5e20">Fast feedback</text>
  <text x="102" y="269" font-size="11" text-anchor="middle" fill="#2e7d32">act on it now</text>

  <!-- Warning -->
  <g filter="url(#soft2)"><rect x="160" y="500" width="320" height="66" rx="14" fill="url(#lRed)" stroke="#e53935" stroke-width="2" stroke-dasharray="7,5"/></g>
  <text x="320" y="528" font-size="14" text-anchor="middle" font-weight="bold" fill="#b71c1c">&#10007; A slow suite breaks the loop</text>
  <text x="320" y="550" font-size="12" text-anchor="middle" fill="#c62828">feedback arrives too late to act on</text>
</svg>
